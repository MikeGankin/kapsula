<main class="coral kapsula" data-kapsula-hero aria-labelledby="kapsula-title">
    <header class="kapsula-header">
        <div class="kapsula-header__inner layout-container-limit center">
            <a class="kapsula-header__logo-link" href="/" aria-label="Coral Travel Elite Service — на главную">
                <img
                        class="kapsula-header__logo"
                        src="https://b2ccdn.coral.ru/content/new-elite-service-logo.svg"
                        width="168"
                        height="36"
                        alt="Coral Travel Elite Service"
                        loading="eager"
                >
            </a>
            <button class="kapsula-button kapsula-button--header" type="button" data-kapsula-header-contact>
                <span class="kapsula-button__text">Связаться с менеджером</span>
                <span class="kapsula-button__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.62 10.79C8.06 13.62 10.38 15.93 13.21 17.38L15.41 15.18C15.68 14.91 16.08 14.82 16.43 14.94C17.55 15.31 18.75 15.5 20 15.5C20.55 15.5 21 15.95 21 16.5V20C21 20.55 20.55 21 20 21C10.61 21 3 13.39 3 4C3 3.45 3.45 3 4 3H7.5C8.05 3 8.5 3.45 8.5 4C8.5 5.25 8.69 6.45 9.06 7.57C9.17 7.92 9.09 8.31 8.81 8.59L6.62 10.79Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </button>
        </div>
    </header>
    <div class="kapsula__backdrop" aria-hidden="true"></div>
    <video
            class="kapsula__background-video"
            data-kapsula-background-video
            data-src="https://b2ccdn.coral.ru/content/promo/capsule_video.mp4"
            muted
            loop
            playsinline
            preload="none"
            aria-hidden="true"
    ></video>
    <div class="kapsula__video-shade" aria-hidden="true"></div>
    <div class="kapsula__veil" aria-hidden="true"></div>

    <div class="kapsula__inner">
        <include src="./kapsula/hero-screen.html"></include>
        <include src="./kapsula/steps-screen.html"></include>
        <include src="./kapsula/styles-screen.html"></include>
        <include src="./kapsula/form-screen.html"></include>
        <include src="./kapsula/popup.html"></include>
    </div>
</main>
