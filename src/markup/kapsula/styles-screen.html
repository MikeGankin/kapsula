<section class="kapsula-screen kapsula-screen--styles" data-kapsula-screen="styles" aria-hidden="true">
  <div class="kapsula-styles layout-container-limit center">
    <div class="kapsula-copy kapsula-copy--styles">
      <h2 class="kapsula-copy__title">Выберите стиль вашего отдыха</h2>
    </div>

    <div class="kapsula-card-grid kapsula-styles__grid">
      <article class="kapsula-style-card">
        <div class="kapsula-style-card__media">
          <img
            class="kapsula-style-card__image"
            src="/kapsula-hero.webp"
            alt="Азиатский стиль"
            loading="lazy"
          >
        </div>
        <div class="kapsula-style-card__body">
          <h3 class="kapsula-style-card__title">Азиатский стиль</h3>
          <p class="kapsula-style-card__text">Мягкий лён, бамбук и туман над рисовыми полями</p>
          <button class="kapsula-button" type="button" data-kapsula-capsule="asian">Выбрать стиль и собрать капсулу</button>
        </div>
      </article>

      <article class="kapsula-style-card">
        <div class="kapsula-style-card__media">
          <img
            class="kapsula-style-card__image kapsula-style-card__image--center"
            src="/kapsula-hero.webp"
            alt="Восточный стиль"
            loading="lazy"
          >
        </div>
        <div class="kapsula-style-card__body">
          <h3 class="kapsula-style-card__title">Восточный стиль</h3>
          <p class="kapsula-style-card__text">Струящийся шелк, орнаменты и яркие краски</p>
          <button class="kapsula-button" type="button" data-kapsula-capsule="oriental">Выбрать стиль и собрать капсулу</button>
        </div>
      </article>

      <article class="kapsula-style-card">
        <div class="kapsula-style-card__media">
          <img
            class="kapsula-style-card__image kapsula-style-card__image--right"
            src="/kapsula-hero.webp"
            alt="Островной стиль"
            loading="lazy"
          >
        </div>
        <div class="kapsula-style-card__body">
          <h3 class="kapsula-style-card__title">Островной стиль</h3>
          <p class="kapsula-style-card__text">Белый хлопок, тропические цветы и лазурь океана</p>
          <button class="kapsula-button" type="button" data-kapsula-capsule="island">Выбрать стиль и собрать капсулу</button>
        </div>
      </article>
    </div>
  </div>
</section>
