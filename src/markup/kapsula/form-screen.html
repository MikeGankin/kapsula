<section class="kapsula-screen kapsula-screen--form" data-kapsula-screen="form" aria-hidden="true" inert>
    <include src="./kapsula/progress-inline.html"></include>
    <div class="kapsula-form-screen kapsula-form-screen--offset-top layout-container-limit center">
        <div class="kapsula-form-screen__layout">
            <div class="kapsula-form-screen__main">
                <div class="kapsula-copy kapsula-copy--form">
                    <h2 class="kapsula-copy__title" data-kapsula-form-title>Азиатский стиль</h2>
                    <p class="kapsula-form-screen__subtitle" data-kapsula-form-subtitle></p>
                </div>

                <form class="kapsula-form" data-kapsula-form novalidate></form>
                <button class="kapsula-button kapsula-form__trigger" type="button">Сформировать капсулу</button>
            </div>

            <aside class="kapsula-form-screen__aside">
                <div class="kapsula-form-screen__media">
                    <picture class="kapsula-form-screen__picture">
                        <source media="(min-width: 993px)" srcset="/asia-base.webp">
                        <img
                                class="kapsula-form-screen__image"
                                data-kapsula-form-image
                                src="/asia-base-mob.webp"
                                alt="Девушка в светлом льняном образе идет по тропической вилле с бамбуковой крышей"
                                width="792"
                                height="440"
                                loading="lazy"
                                decoding="async">
                    </picture>
                    <div class="kapsula-form-screen__overlay" data-kapsula-form-overlay-images aria-hidden="true"></div>
                </div>
            </aside>
        </div>
    </div>
</section>
